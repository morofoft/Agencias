<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hallazgos</title>

  <meta name="theme-color" content="#4f46e5" />

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/icons/Logo-vertical-azul.png" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

<body class="bg-slate-50 h-screen flex flex-col">

<header class="bg-indigo-600 text-white px-5 py-5 rounded-b-3xl shadow-lg">

    <span id="criticalBadge"
  class="hidden bg-red-600 text-white text-[10px] px-2 py-1 rounded-full font-bold">

</span>


    <button id="btn-new"
      class="bg-white/20 px-4 py-2 rounded-full text-sm font-bold flex items-center gap-2">
      <i class="fa fa-plus"></i> Nuevo
    </button>

    <a href="index.html">Volver</a>

</header>

<div class="flex gap-2 mt-5 mb-4 p-5">

    class="border rounded px-3 py-2 text-sm w-full">

  <input type="date" id="toDate"
    class="border rounded px-3 py-2 text-sm w-full">

  <button id="btnFilter"
    class="bg-indigo-600 text-white px-4 rounded text-sm">
    Filtrar
  </button>
</div>

<main class="flex-1 overflow-y-auto p-4 space-y-4" id="findings-list"></main>

<script type="module">

  requireAuth();
