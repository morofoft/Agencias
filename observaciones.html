<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Notas | Agencia Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/idb@8/build/umd.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#f8fafc] min-h-screen pb-20">

    <header class="bg-indigo-700 text-white p-6 rounded-b-[2rem] shadow-lg mb-6">
        <div class="flex justify-between items-center">
            <a href="cercana.html" class="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center">
                <i class="fa fa-arrow-left"></i>
            </a>
            <h1 class="text-xl font-bold">Historial Completo</h1>
            <button id="btnExport" class="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center">
                <i class="fa fa-file-excel"></i>
            </button>
        </div>
    </header>

    <main class="px-4 space-y-6">
        
        <div class="flex gap-2 overflow-x-auto pb-2 no-scrollbar">
            <button onclick="filterBy('TODAS')" class="bg-indigo-600 text-white px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap shadow-md">Todas</button>
            <button onclick="filterBy('Excelente')" class="bg-white text-emerald-600 px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap border border-emerald-100 shadow-sm">Excelente</button>
            <button onclick="filterBy('Regular')" class="bg-white text-amber-600 px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap border border-amber-100 shadow-sm">Regular</button>
            <button onclick="filterBy('Crítico')" class="bg-white text-rose-600 px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap border border-rose-100 shadow-sm">Crítico</button>
        </div>

        <div class="relative">
            <i class="fa fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" id="searchAgency" placeholder="Buscar por código AG..." 
                class="w-full bg-white border border-slate-200 py-4 pl-12 pr-4 rounded-2xl shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div id="historyContainer" class="space-y-4">
            <div class="animate-pulse flex flex-col gap-4">
                <div class="h-32 bg-slate-200 rounded-3xl"></div>
                <div class="h-32 bg-slate-200 rounded-3xl"></div>
            </div>
        </div>
    </main>

    <script type="module" src="./js/observaciones/observaciones.page.js"></script>
</body>
</html>
