<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Sistema de Gestión de Agencias</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="assets/icons/Logo-vertical-azul.png" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
    .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
    .card-shadow { box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05); }
    .input-focus { transition: all 0.2s ease; border: 1px solid #e2e8f0; }
    .input-focus:focus { border-color: #6366f1; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); outline: none; }
    select { appearance: none; background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%2364748b' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e"); background-position: right 0.75rem center; background-repeat: no-repeat; background-size: 1.25em; }
  </style>
</head>

<body class="text-slate-900">

  <header class="sticky top-0 z-50 glass border-b border-slate-200/60 px-4 py-3">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <a href="index.html" class="group p-2.5 hover:bg-white rounded-xl transition-all border border-transparent hover:border-slate-200 shadow-sm">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-500 group-hover:text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
          </svg>
        </a>
        <div>
          <h1 class="text-lg font-bold tracking-tight text-slate-800">Panel de Agencias</h1>
          <div id="counter" class="text-[10px] font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-md inline-block uppercase border border-indigo-100"></div>
        </div>
      </div>
      <div class="flex items-center gap-3">
          <div class="hidden sm:block text-right">
              <p class="text-[10px] font-bold text-slate-400 uppercase leading-none">Usuario Administrador</p>
              <p class="text-xs font-semibold text-slate-700">Pedro Garcia</p>
          </div>
          <div class="h-10 w-10 rounded-2xl bg-gradient-to-br from-indigo-500 to-violet-600 shadow-lg shadow-indigo-200 flex items-center justify-center text-white font-bold ring-2 ring-white">PG</div>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8">
    
    <section class="bg-white p-6 rounded-[2rem] card-shadow border border-slate-200/60 mb-10">
      <div class="flex items-center gap-3 mb-6">
        <div class="w-8 h-8 rounded-lg bg-indigo-50 flex items-center justify-center">
            <svg class="w-4 h-4 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
        </div>
        <h2 class="text-sm font-bold text-slate-700 uppercase tracking-wider">Registrar Nueva Agencia</h2>
      </div>

      <form id="agencyForm" class="grid grid-cols-1 md:grid-cols-12 gap-5">
        <div class="md:col-span-3 space-y-1.5">
          <label class="text-[11px] font-bold text-slate-500 ml-1 uppercase tracking-wide">Código ID</label>
          <input id="idReal" class="w-full bg-slate-50 rounded-xl px-4 py-3 input-focus text-sm font-medium" placeholder="AG-000001" required />
        </div>
        <div class="md:col-span-3 space-y-1.5">
          <label class="text-[11px] font-bold text-slate-500 ml-1 uppercase tracking-wide">Zona</label>
          <input id="zona" class="w-full bg-slate-50 rounded-xl px-4 py-3 input-focus text-sm font-medium" placeholder="A, B, C, D,..." required />
        </div>
        <div class="md:col-span-6 space-y-1.5">
          <label class="text-[11px] font-bold text-slate-500 ml-1 uppercase tracking-wide">Dirección Detallada</label>
          <input id="direccion" class="w-full bg-slate-50 rounded-xl px-4 py-3 input-focus text-sm font-medium" placeholder="Calle, número, ciudad..." />
        </div>

        <button class="md:col-span-12 bg-indigo-600 hover:bg-indigo-700 text-white w-full py-3.5 rounded-xl font-bold transition-all shadow-lg shadow-indigo-100 flex items-center justify-center gap-2 mt-2">
          Guardar Agencia en Sistema
        </button>
      </form>
    </section>

    <section class="space-y-5 mb-8">
      <div class="flex flex-col md:flex-row gap-4">
        <div class="relative flex-grow">
          <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </span>
          <input id="searchInput" type="text" placeholder="Buscar por ID, zona o dirección..." class="w-full bg-white border border-slate-200 rounded-2xl pl-12 pr-4 py-3.5 shadow-sm focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none transition-all font-medium text-sm" />
        </div>
        
        <div class="flex gap-2">
          <select id="stateFilter" class="flex-1 md:w-44 bg-white border border-slate-200 rounded-2xl px-4 py-3.5 text-xs font-bold text-slate-600 shadow-sm outline-none cursor-pointer hover:border-indigo-300 transition-colors uppercase tracking-tight">
            <option value="all font-bold">Todos los Estados</option>
            <option value="located">Ubicadas</option>
            <option value="pending">Pendientes</option>
          </select>
          
          <select id="orderSelect" class="bg-white border border-slate-200 rounded-2xl px-4 py-3.5 text-xs font-bold text-slate-600 shadow-sm outline-none cursor-pointer hover:border-indigo-300 transition-colors uppercase">
            <option value="az">A-Z</option>
            <option value="za">Z-A</option>
          </select>
        </div>
      </div>
      
      <div class="flex justify-between items-center px-2">
        <p id="resultsCounter" class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]"></p>
      </div>
    </section>
    
    <div id="agenciesList" class="grid grid-cols-1 gap-4">
        </div>

  </main>

  <footer class="mt-20 py-10 border-t border-slate-200 text-center">
    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">&copy; 2026 Pedro Garcia &bull; GesAg</p>
  </footer>

  <script type="module">
    import { requireAuth } from "./js/auth.guard.js";
  
    requireAuth();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/idb@8/build/umd.js"></script>
  <script type="module" src="js/dataAgencias.js"></script>
</body>
</html>
