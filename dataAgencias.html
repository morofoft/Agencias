<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Gestión de Agencias</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); }
    /* Estilo para los selects nativos más limpios */
    select { appearance: none; background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e"); background-position: right 0.5rem center; background-repeat: no-repeat; background-size: 1.5em 1.5em; padding-right: 2.5rem; }
  </style>
</head>

<body class="bg-slate-50 min-h-screen pb-20 text-slate-900">

  <header class="sticky top-0 z-20 glass border-b border-slate-200 px-4 md:px-6 py-4">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-4">
        <a href="index.html" class="p-2 hover:bg-slate-100 rounded-full transition-colors text-slate-500" title="Volver">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
          </svg>
        </a>
        <div>
          <h1 class="text-xl font-extrabold tracking-tight">Gestión de Agencias</h1>
          <p id="counter" class="text-[10px] font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full inline-block uppercase tracking-wider"></p>
        </div>
      </div>
      <div class="h-10 w-10 rounded-xl bg-indigo-600 shadow-lg shadow-indigo-200 flex items-center justify-center text-white font-bold tracking-tighter">GA</div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 mt-8">
    
    <section class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 mb-10 transition-all hover:shadow-md">
      <h2 class="text-xs font-black text-slate-400 uppercase tracking-[0.2em] mb-6 flex items-center gap-2">
        <span class="w-2 h-2 bg-indigo-500 rounded-full animate-pulse"></span> Añadir Nueva Agencia
      </h2>

      <form id="agencyForm" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
        <div class="space-y-1">
          <label class="text-[10px] font-bold text-slate-500 ml-1 uppercase">Código ID</label>
          <input id="idReal" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all outline-none" placeholder="Ej: AG-000000" required />
        </div>
        <div class="space-y-1">
          <label class="text-[10px] font-bold text-slate-500 ml-1 uppercase">Zona Geográfica</label>
          <input id="zona" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all outline-none" placeholder="A, B, C,..." required />
        </div>
        <div class="space-y-1 md:col-span-2 lg:col-span-1">
          <label class="text-[10px] font-bold text-slate-500 ml-1 uppercase">Dirección</label>
          <input id="direccion" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all outline-none" placeholder="Opcional..." />
        </div>

        <button class="md:col-span-2 lg:col-span-3 bg-slate-900 hover:bg-indigo-600 text-white w-full py-4 rounded-2xl font-bold transition-all shadow-xl shadow-slate-200 flex items-center justify-center gap-2 mt-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
          </svg>
          Registrar en Base de Datos
        </button>
      </form>
    </section>

    <section class="space-y-4 mb-8">
      <div class="flex flex-col md:flex-row gap-3">
        <div class="relative flex-grow">
          <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </span>
          <input id="searchInput" type="text" placeholder="Buscar agencia..." class="w-full bg-white border border-slate-200 rounded-2xl pl-11 pr-4 py-3 shadow-sm focus:ring-2 focus:ring-indigo-500 outline-none transition" />
        </div>
        
        <div class="flex gap-2">
          <select id="stateFilter" class="bg-white border border-slate-200 rounded-2xl px-4 py-3 text-sm font-medium shadow-sm focus:ring-2 focus:ring-indigo-500 outline-none cursor-pointer">
            <option value="all">Todos los estados</option>
            <option value="located">Ubicadas</option>
            <option value="pending">Pendientes</option>
          </select>
          
          <select id="orderSelect" class="bg-white border border-slate-200 rounded-2xl px-4 py-3 text-sm font-medium shadow-sm focus:ring-2 focus:ring-indigo-500 outline-none cursor-pointer">
            <option value="az">A → Z</option>
            <option value="za">Z → A</option>
          </select>
        </div>
      </div>
      
      <div class="flex justify-between items-center px-2">
        <p id="resultsCounter" class="text-[11px] font-bold text-slate-400 uppercase tracking-widest"></p>
      </div>
    </section>
    
    <div id="agenciesList" class="grid grid-cols-1 gap-4">
      </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/idb@8/build/umd.js"></script>
  <script type="module" src="js/dataAgencias.js"></script>
</body>
</html>
