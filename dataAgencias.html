<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Ubicación de Agencias</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen p-4">

  <h1 class="text-xl font-bold mb-1">📍 Ubicación de agencias</h1>
  <p id="counter" class="text-sm text-gray-600 mb-4"></p>

  <!-- FORMULARIO -->
  <div class="bg-white p-4 rounded-lg shadow mb-6">
    <h2 class="font-semibold mb-3">➕ Agregar agencia (sin ubicación)</h2>

    <form id="agencyForm" class="space-y-3">
      <input
        type="text"
        id="idReal"
        placeholder="Código de agencia"
        class="w-full border rounded px-3 py-2"
        required
      />

      <input
        type="text"
        id="zona"
        placeholder="Zona"
        class="w-full border rounded px-3 py-2"
        required
      />

      <input
        type="text"
        id="direccion"
        placeholder="Dirección"
        class="w-full border rounded px-3 py-2"
        required
      />

      <button
        type="submit"
        class="bg-green-600 text-white px-4 py-2 rounded w-full">
        Guardar agencia
      </button>
    </form>
  </div>

  <!-- LISTADO -->
  <div id="agenciesList" class="space-y-3"></div>

  <script type="module" src="js/dataAgencias.js"></script>
</body>
</html>
