<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Gestión de Agencias</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen p-4">

  <h1 class="text-xl font-black mb-1">🏢 Gestión de Agencias</h1>
  <p id="counter" class="text-sm text-slate-500 mb-4"></p>

  <!-- FORMULARIO -->
  <div class="bg-white p-4 rounded-xl shadow mb-6">
    <h2 class="font-bold mb-3">➕ Nueva agencia (sin ubicación)</h2>

    <form id="agencyForm" class="space-y-3">
      <input id="idReal" class="w-full border rounded px-3 py-2" placeholder="Código de agencia" required />
      <input id="zona" class="w-full border rounded px-3 py-2" placeholder="Zona" required />
      <input id="direccion" class="w-full border rounded px-3 py-2" placeholder="Dirección" />

      <button class="bg-indigo-600 text-white w-full py-2 rounded font-bold">
        Guardar agencia
      </button>
    </form>
  </div>

  <!-- LISTA -->
  <div id="agenciesList" class="space-y-3"></div>

  <script type="module" src="js/dataAgencias.js"></script>
</body>
</html>
