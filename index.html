<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Control de Agencias</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/icon-192.ico">

  <!-- Tailwind -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <link rel="stylesheet" href="css/app.css">

  


</head>

<body class="bg-gray-100 text-gray-800">


  <header class="bg-blue-600 text-white p-3 flex justify-between">
    <h1 class="font-bold">Control de Agencias</h1>
    <button id="btnAddAgency" class="bg-white text-blue-600 px-3 py-1 rounded">
      + Agencia
    </button>
    <span id="networkStatus" class="text-sm"> 🟢🔴</span>
  </header>

  <!-- MAIN -->
  <main class="p-4">
    <div class="bg-white rounded shadow p-4">
      <h2 class="font-semibold text-lg mb-2">
        Estado del sistema
      </h2>

      <ul class="space-y-2 text-sm">
        <li>✔ PWA instalada</li>
        <li>✔ Modo offline activo</li>
        <li>✔ Service Worker registrado</li>
      </ul>
    </div>
    <button onclick="exportAll()" class="bg-green-600 text-white px-4 py-2 rounded">
      Exportar Excel
    </button>
    
    <div id="map" class="w-full h-[70vh] rounded shadow mt-4"></div>

  </main>

  <!-- IDB LOCAL (GLOBAL) -->
  <script src="https://cdn.jsdelivr.net/npm/idb@8/build/umd.js"></script>
<!-- Leaflet CSS -->
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<!-- Leaflet JS (GLOBAL) -->
<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  defer
></script>


  <!-- JS -->
  <script src="js/network.js"></script>
  <script src="js/sw-register.js"></script>
  <script type="module" src="js/app.js"></script>

</body>

</html>
