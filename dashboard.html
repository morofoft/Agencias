<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/icons/icon-192.ico" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>
<body class="bg-gray-100 p-4">

  <h1 class="text-2xl font-bold mb-4">
    <i class="fas fa-chart-line text-red-600"></i>
    Dashboard de Hallazgos
  </h1>

  <!-- CARD RESUMEN -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">

    <div class="bg-white p-4 rounded shadow border-l-4 border-red-600">
      <h2 class="text-sm text-gray-500">Críticos Pendientes</h2>
      <p id="criticalCount" class="text-3xl font-bold text-red-600">0</p>
    </div>

  </div>

  <!-- LISTADO -->
  <div class="bg-white rounded shadow p-4">
    <h2 class="font-semibold mb-3">
      <i class="fas fa-exclamation-triangle text-red-600"></i>
      Detalle de Hallazgos Críticos
    </h2>

    <div id="criticalList" class="space-y-3"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/idb@8/build/umd.js"></script>
  <script src="js/sw-register.js"></script>
  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
