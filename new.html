<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevas Agencias | Panel de Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/idb@8/build/umd.js"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col justify-between font-sans antialiased selection:bg-cyan-500 selection:text-black">

    <main class="w-full max-w-4xl mx-auto p-4 sm:p-6 flex-grow">
        <header class="mb-6 border-b border-gray-800 pb-4">
            <h1 class="text-2xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 uppercase">
                Carga Masiva de Agencias
            </h1>
            <p class="text-xs text-gray-400 mt-1">Estructura esperada: Terminal (ID) | Dirección | Zona | Geolocalización (Lat, Lng)</p>
        </header>

        <section class="bg-gray-900 border border-gray-800 rounded-xl p-4 sm:p-6 shadow-2xl">
            <div class="mb-4">
                <label for="raw-data" class="block text-sm font-semibold text-cyan-400 uppercase tracking-wider mb-2">
                    Pegar Datos de Agencias (Separados por Tabulador o Comas)
                </label>
                <textarea id="raw-data" rows="10" 
                    class="w-full bg-gray-950 border border-gray-800 rounded-lg p-3 text-sm font-mono text-green-400 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 placeholder-gray-600 transition-all resize-y"
                    placeholder="Ejemplo:&#13;10243	Calle Principal #5	LOCALES	18.486,-69.931&#13;10244	Av. Central #12	LOCALES	18.489,-69.935"></textarea>
            </div>

            <button id="btn-process" 
                class="w-full sm:w-auto bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-black font-bold uppercase text-xs tracking-widest py-3.5 px-6 rounded-lg transition-all transform active:scale-95 shadow-lg shadow-cyan-500/20">
                Procesar e Importar Agencias
            </button>

            <div id="status-container" class="mt-6 hidden">
                <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">Logs de Operación:</h3>
                <div id="status-log" class="bg-gray-950 border border-gray-800 rounded-lg p-4 h-48 overflow-y-auto font-mono text-xs text-gray-300 space-y-1">
                    </div>
            </div>
        </section>
    </main>

    <footer class="w-full border-t border-gray-950 bg-gray-900/50 backdrop-blur text-center py-3 text-[10px] text-gray-500 tracking-widest uppercase">
        Dep. de Redes &copy; 2026
    </footer>

    <script type="module">
        import { requireAuth } from "./js/auth.guard.js";
      
        requireAuth();
      </script>

    <script type="module">
        import { processBulkAgencies } from './js/agencies/agencies.actions.js';

        const btnProcess = document.getElementById('btn-process');
        const rawDataInput = document.getElementById('raw-data');
        const statusContainer = document.getElementById('status-container');
        const statusLog = document.getElementById('status-log');

        function logMessage(text, type = 'info') {
            const colors = {
                info: 'text-gray-400',
                success: 'text-cyan-400 font-semibold',
                error: 'text-red-400 font-semibold'
            };
            const p = document.createElement('p');
            p.className = colors[type];
            p.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
            statusLog.appendChild(p);
            statusLog.scrollTop = statusLog.scrollHeight; // Auto-scroll al final
        }

        btnProcess.addEventListener('click', async () => {
            const data = rawDataInput.value.trim();
            if (!data) {
                alert('Por favor, pega algunos datos antes de continuar.');
                return;
            }

            // Bloquear botón e iniciar logs
            btnProcess.disabled = true;
            btnProcess.classList.add('opacity-50', 'cursor-not-allowed');
            statusContainer.classList.remove('hidden');
            statusLog.innerHTML = ''; 

            logMessage('Iniciando importación masiva...', 'info');

            // Llamamos a la acción encargada de procesar
            await processBulkAgencies(data, logMessage);

            logMessage('Proceso finalizado.', 'success');
            btnProcess.disabled = false;
            btnProcess.classList.remove('opacity-50', 'cursor-not-allowed');
        });
    </script>
</body>
</html>
