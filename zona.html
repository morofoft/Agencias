<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Selección de Zona</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <header class="bg-white shadow-sm p-4 sticky top-0 z-10">
        <div class="flex items-center gap-3">
            <a href="index.html" class="text-slate-600"><i class="fas fa-arrow-left"></i></a>
            <h1 class="text-xl font-bold text-slate-800">Agencias por Zona</h1>
        </div>
    </header>

    <main class="p-4">
        <div class="mb-6">
            <label class="block text-sm font-medium text-slate-600 mb-2">Selecciona una Zona</label>
            <select id="zoneSelect" class="w-full p-3 rounded-xl border-slate-200 bg-white shadow-sm focus:ring-2 focus:ring-blue-500 outline-none">
                <option value="">-- Elige zona --</option>
                <option value="A">Zona A</option>
                <option value="B">Zona B</option>
                <option value="C">Zona C</option>
                <option value="D">Zona D</option>
            </select>
        </div>

        <div id="agenciesList" class="space-y-3">
            <div class="text-center py-10 text-slate-400">
                <i class="fas fa-map-marked-alt text-4xl mb-3"></i>
                <p>Selecciona una zona para ver las agencias</p>
            </div>
        </div>
    </main>
    <script type="module">
        import { requireAuth } from "./js/auth.guard.js";
      
        requireAuth();
      </script>
    <script src="https://cdn.jsdelivr.net/npm/idb@8/build/umd.js"></script>

    <script type="module" src="./js/appzones.js"></script>
</body>
</html>
